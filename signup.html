<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | CampusVoice</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef4ff, #f8fbff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-card {
            width: 390px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
            text-align: center;
        }

        .logo {
            font-size: 42px;
            margin-bottom: 8px;
        }

        h1 {
            color: #172554;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="signup-card">

        <div class="logo">🎓</div>

        <h1>CampusVoice</h1>

        <p class="subtitle">
            Create your student account
        </p>

        <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
        >

        <input
            type="password"
            id="signupPassword"
            placeholder="Create password"
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
        >

        <button onclick="createAccount()">
            📝 Create Account
        </button>

        <p id="message"></p>

        <a href="index.html" class="back">
            ← Back to Login
        </a>

    </div>


    <script>

        const SUPABASE_URL =
            "https://etreifswdsgcvtowwcwv.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_jlCT7TmfGZns53t9NtkQMQ_E_n955It";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function createAccount() {

            const email =
                document.getElementById("signupEmail").value.trim();

            const password =
                document.getElementById("signupPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message =
                document.getElementById("message");


            if (!email || !password || !confirmPassword) {

                message.innerText =
                    "⚠️ Please fill all fields.";

                return;
            }


            if (password !== confirmPassword) {

                message.innerText =
                    "❌ Passwords do not match.";

                return;
            }


            const { error } =
                await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });


            if (error) {

                message.innerText =
                    "❌ " + error.message;

                return;
            }


            message.innerText =
                "✅ Account created! Please check your email to confirm your account.";

        }

    </script>

</body>
</html>
