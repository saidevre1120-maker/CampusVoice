<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusVoice - Reset Password</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            width: min(90%, 420px);
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            text-align: center;
        }
        h2 { color: #1e3a8a; }
        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }
        button {
            width: 90%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        #message { margin-top: 15px; }
    </style>
</head>
<body>
<div class="card">
    <div style="font-size:45px;">🎓</div>
    <h2>Reset Password</h2>
    <p>Enter your new Student Login password.</p>

    <input type="password" id="newPassword" placeholder="🔒 New Password">
    <input type="password" id="confirmPassword" placeholder="🔒 Confirm Password">

    <button onclick="updatePassword()">Update Password</button>
    <p id="message"></p>
</div>

<script>
const SUPABASE_URL = "https://etreifswdsgcvtowwcwv.supabase.co";
const SUPABASE_KEY = "sb_publishable_jlCT7TmfGZns53t9NtkQMQ_E_n955It";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function updatePassword() {
    const password = document.getElementById("newPassword").value;
    const confirm = document.getElementById("confirmPassword").value;
    const message = document.getElementById("message");

    if (!password || !confirm) {
        message.innerText = "Please enter both fields.";
        return;
    }

    if (password !== confirm) {
        message.innerText = "❌ Passwords do not match.";
        return;
    }

    if (password.length < 6) {
        message.innerText = "❌ Password must be at least 6 characters.";
        return;
    }

    const { error } = await supabaseClient.auth.updateUser({
        password: password
    });

    if (error) {
        console.error(error);
        message.innerText = "❌ " + error.message;
        return;
    }

    message.innerText = "✅ Password updated successfully.";

    setTimeout(() => {
        window.location.href = "https://saidevre1120-maker.github.io/CampusVoice/";
    }, 1500);
}
</script>
</body>
</html>
